name: Package

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      # Change next to latest after the package command reaches the stable channel.
      - name: Install Toolbox
        run: npm install --global @include-tools/toolbox@next

      - name: Package
        run: toolbox package pack . --out dist

      - name: Check package artifacts
        run: |
          test -s dist/hacker-news.toolbox.pkg
          test -s dist/toolbox.pkg.json

      - name: Retain package artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hacker-news-package
          path: |
            dist/hacker-news.toolbox.pkg
            dist/toolbox.pkg.json
          if-no-files-found: error

      - name: Publish release assets
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            dist/hacker-news.toolbox.pkg \
            dist/toolbox.pkg.json \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
          gh release view "$GITHUB_REF_NAME" \
            --json assets \
            --jq '.assets | map(.name) | sort | join("\n")' |
            grep -Fx -e hacker-news.toolbox.pkg -e toolbox.pkg.json
